{% if modo == "editar" %}
<form class="formulario-tarea" id="tarea-{{ tarea.id }}"
      hx-put="/tareas/{{ tarea.id }}" hx-target="this" hx-swap="outerHTML">
{% else %}
<form class="formulario-tarea formulario-crear"
      hx-post="/tareas"
      hx-target="#columna-{{ columna_clave }} .lista"
      hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  <input type="hidden" name="columna" value="{{ columna_clave }}">
{% endif %}
  <input type="text" name="titulo" placeholder="Nueva tarea..."
         value="{{ tarea.titulo if tarea else '' }}" required>
  <input type="text" name="etiqueta" placeholder="Etiqueta (opcional)"
         value="{{ tarea.etiqueta if tarea else '' }}">
  <button type="submit">{{ "Guardar" if modo == "editar" else "Añadir" }}</button>
</form>
