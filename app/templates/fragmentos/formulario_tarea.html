{% if modo == "editar" %}
<form class="formulario-tarea formulario-editar" id="tarea-{{ tarea.id }}"
      hx-put="/tareas/{{ tarea.id }}" hx-target="this" hx-swap="outerHTML">
  <input type="text" name="titulo" value="{{ tarea.titulo }}" required>
  <textarea name="descripcion" rows="2" placeholder="Descripción (opcional)">{{ tarea.descripcion }}</textarea>
  <div class="formulario-fila">
    <input type="text" name="etiqueta" placeholder="Etiqueta" value="{{ tarea.etiqueta or '' }}">
    <input type="date" name="fecha_limite" value="{{ tarea.fecha_limite or '' }}">
  </div>
  <div class="formulario-fila">
    <select name="categoria" title="Categoría">
      <option value="sin" {% if tarea.categoria_id is none %}selected{% endif %}>Sin categoría</option>
      {% for categoria in categorias %}
      <option value="{{ categoria.id }}" {% if tarea.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nombre }}</option>
      {% endfor %}
    </select>
    <select name="prioridad" title="Prioridad">
      {% for opcion in ["alta", "media", "baja"] %}
      <option value="{{ opcion }}" {% if tarea.prioridad.value == opcion %}selected{% endif %}>Prioridad {{ opcion }}</option>
      {% endfor %}
    </select>
  </div>
  <p class="formulario-ayuda">La columna se cambia arrastrando la tarjeta en el tablero.</p>
  <div class="formulario-acciones">
    <button type="submit">Guardar</button>
    <button type="button" class="boton-secundario"
            hx-get="/tareas/{{ tarea.id }}" hx-target="#tarea-{{ tarea.id }}" hx-swap="outerHTML">
      Cancelar
    </button>
  </div>
</form>
{% else %}
<div class="formulario-crear" id="creador-{{ columna_clave }}">
  <button type="button" class="disparador" data-abre-creador="{{ columna_clave }}">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 2.6v8.8M2.6 7h8.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    </svg>
    Nueva tarea
  </button>
  <form class="formulario-tarea" style="display: none"
        hx-post="/tareas"
        hx-target="#lista-{{ columna_clave }}"
        hx-swap="beforeend"
        hx-on::after-request="if(event.detail.successful) this.reset(); cerrarCreador(this)">
    <input type="hidden" name="columna" value="{{ columna_clave }}">
    <input type="text" name="titulo" placeholder="Título de la tarea" required>
    <div class="formulario-fila">
      <input type="text" name="etiqueta" placeholder="Etiqueta (opcional)">
      <select name="categoria" title="Categoría">
        <option value="sin">Sin categoría</option>
        {% for categoria in categorias %}
        <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="formulario-acciones">
      <button type="submit">Añadir</button>
      <button type="button" class="boton-secundario" onclick="cerrarCreador(this.closest('form'))">Cancelar</button>
    </div>
  </form>
</div>
{% endif %}
