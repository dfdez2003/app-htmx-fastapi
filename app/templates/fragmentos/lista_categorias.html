<ul class="lista-categorias" id="lista-categorias">
  {% for categoria in categorias %}
  <li class="fila-categoria">
    <form class="formulario-categoria-editar" onsubmit="return false"
          hx-put="/categorias/{{ categoria.id }}" hx-trigger="change"
          hx-target="#lista-categorias" hx-swap="outerHTML">
      <input type="color" name="color" value="{{ categoria.color }}" title="Color">
      <input type="text" name="nombre" value="{{ categoria.nombre }}" required>
    </form>
    <span class="categoria-uso">{{ categoria.tareas|length }} tareas</span>
    <button type="button" class="boton-icono peligro" title="Eliminar"
            hx-delete="/categorias/{{ categoria.id }}"
            hx-target="#lista-categorias" hx-swap="outerHTML"
            hx-confirm="¿Eliminar &quot;{{ categoria.nombre }}&quot;? Sus tareas quedarán sin categoría.">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2.8 4h8.4M5.6 4V2.8h2.8V4M4 4l.5 7.2h5L10 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </li>
  {% else %}
  <li class="fila-categoria-vacia">Todavía no hay categorías.</li>
  {% endfor %}
</ul>
