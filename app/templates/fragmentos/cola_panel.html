<button type="button" id="cola-toggle" class="cola-toggle{% if cola_abierta %} abierta{% endif %}" title="Cola de trabajo">
  <svg width="20" height="20" viewBox="0 0 18 18" fill="none">
    <path d="M7 4.5h8M7 9h8M7 13.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
    <path d="M2.4 3.4h1.2v2.4M2.4 12.2h1.4c.7 0 .7 1 0 1.1-.7.1-.7 1.1 0 1.1H3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M2.3 8.2c.3-.5 1.3-.4 1.3.3 0 .5-1.3 1.2-1.3 1.7h1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <span class="cola-toggle-texto">Cola de trabajo</span>
</button>
<aside id="cola-panel" class="cola-panel{% if cola_abierta %} abierta{% endif %}" aria-label="Cola de trabajo">
  <header class="cola-panel-cabecera">
    <h2>Cola de trabajo</h2>
    <button type="button" class="boton-icono" id="cola-cerrar" title="Cerrar">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
    </button>
  </header>
  {% include "fragmentos/cola_lista.html" %}
</aside>
