<article class="tarjeta{% if tarea.vencida %} vencida{% endif %}" id="tarea-{{ tarea.id }}" data-id="{{ tarea.id }}"
    {% if tarea.categoria %}style="--categoria-color: {{ tarea.categoria.color }};"{% endif %}>
  <div class="tarjeta-cabecera">
    <div class="tarjeta-fila">
      <span class="prioridad prioridad-{{ tarea.prioridad.value }}" title="Prioridad: {{ tarea.prioridad.value }}"></span>
      <h3>{{ tarea.titulo }}</h3>
      <button type="button" class="boton-icono"
              hx-get="/tareas/{{ tarea.id }}/editar" hx-target="#tarea-{{ tarea.id }}" hx-swap="outerHTML"
              title="Editar">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <path d="M9.4 2.2 11.8 4.6 5.2 11.2l-3 .6.6-3 6.6-6.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
        </svg>
      </button>
    </div>
  </div>
  <div class="tarjeta-cuerpo">
    {% if tarea.descripcion %}<p>{{ tarea.descripcion }}</p>{% endif %}
    <div class="meta">
      {% if tarea.categoria %}
      <span class="categoria-chip"><span class="categoria-punto"></span>{{ tarea.categoria.nombre }}</span>
      {% endif %}
      {% if tarea.etiqueta %}<span class="etiqueta">{{ tarea.etiqueta }}</span>{% endif %}
      {% if tarea.fecha_limite %}
      <span class="fecha">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.3"></circle>
          <path d="M7 4.2V7l1.9 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        </svg>
        {{ tarea.fecha_limite|fecha_corta }}
      </span>
      {% endif %}
      <button type="button" class="boton-icono peligro"
              hx-delete="/tareas/{{ tarea.id }}" hx-target="#tarea-{{ tarea.id }}" hx-swap="outerHTML"
              hx-confirm="¿Eliminar esta tarea?" title="Eliminar">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <path d="M2.8 4h8.4M5.6 4V2.8h2.8V4M4 4l.5 7.2h5L10 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
    </div>
  </div>
</article>
