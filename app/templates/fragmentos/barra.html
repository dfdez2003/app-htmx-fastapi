<header class="barra">
  <a href="/" class="marca">
    <span class="marca-icono">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="2" width="3.6" height="12" rx="1.4" fill="#fff" opacity=".95"></rect>
        <rect x="6.2" y="2" width="3.6" height="8" rx="1.4" fill="#fff" opacity=".7"></rect>
        <rect x="10.9" y="2" width="3.6" height="5" rx="1.4" fill="#fff" opacity=".45"></rect>
      </svg>
    </span>
    <span>Flujo</span>
  </a>
  <nav class="cambio-vista">
    <a href="/" class="{% if vista_activa == 'tablero' %}vista-activa{% endif %}">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <rect x="1.6" y="2.4" width="3.4" height="11.2" rx="1.2" stroke="currentColor" stroke-width="1.4"></rect>
        <rect x="6.3" y="2.4" width="3.4" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.4"></rect>
        <rect x="11" y="2.4" width="3.4" height="9.6" rx="1.2" stroke="currentColor" stroke-width="1.4"></rect>
      </svg>
      Tablero
    </a>
    <a href="/checklist" class="{% if vista_activa == 'checklist' %}vista-activa{% endif %}">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M2 4.2h2.6M2 8h2.6M2 11.8h2.6M7 4.2h7M7 8h7M7 11.8h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
      </svg>
      Checklist
    </a>
  </nav>
  <div class="barra-acciones">
    {% include "fragmentos/boton_deshacer.html" %}
    <button type="button" class="boton-barra" id="boton-tema" title="Cambiar tema">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
        <path d="M15 10.6A6.4 6.4 0 0 1 7.4 3a6.6 6.6 0 1 0 7.6 7.6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
      </svg>
    </button>
    <a href="/configuracion" class="boton-barra{% if vista_activa == 'configuracion' %} activo{% endif %}" title="Configuración">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="2.4" stroke="currentColor" stroke-width="1.4"></circle>
        <path d="M9 1.8v1.6M9 14.6v1.6M2.9 2.9l1.1 1.1M14 14l1.1 1.1M1.8 9h1.6M14.6 9h1.6M2.9 15.1 4 14M14 4l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
      </svg>
    </a>
  </div>
</header>
