{% extends "base.html" %}
{% block contenido %}
<header class="cabecera">
  <div class="cabecera-fila">
    <h1>Checklist</h1>
    <a href="/configuracion" class="config-enlace" title="Configuración">⚙️</a>
  </div>
  <nav class="cambio-vista">
    <a href="/">Tablero</a>
    <a href="/checklist" class="vista-activa">Checklist</a>
  </nav>
  <div class="buscador">
    <input type="search" name="buscar" id="buscador-texto" placeholder="Buscar por título..."
           hx-get="/tareas" hx-target="#checklist-lista" hx-swap="innerHTML"
           hx-vals='{"vista": "checklist"}'
           hx-trigger="keyup changed delay:300ms" hx-include="#buscador-etiqueta, #buscador-categoria">
    <input type="text" name="etiqueta" id="buscador-etiqueta" placeholder="Filtrar por etiqueta..."
           hx-get="/tareas" hx-target="#checklist-lista" hx-swap="innerHTML"
           hx-vals='{"vista": "checklist"}'
           hx-trigger="keyup changed delay:300ms" hx-include="#buscador-texto, #buscador-categoria">
    <select name="categoria" id="buscador-categoria" title="Filtrar por categoría"
            hx-get="/tareas" hx-target="#checklist-lista" hx-swap="innerHTML"
            hx-vals='{"vista": "checklist"}'
            hx-trigger="change" hx-include="#buscador-texto, #buscador-etiqueta">
      <option value="">Todas las categorías</option>
      {% for categoria in categorias %}
      <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
      {% endfor %}
      <option value="sin">Sin categoría</option>
    </select>
  </div>
</header>
<main id="checklist-lista" class="checklist-lista">
  {% include "fragmentos/lista_checklist.html" %}
</main>
{% endblock %}
