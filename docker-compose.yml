services:
  app:
    build: .
    ports:
      - "8100:8000"
    environment:
      # Docker Compose lee el archivo .env del proyecto (no versionado) para
      # rellenar estas variables. Sin .env quedan vacías y la app trabaja solo
      # con la caché local, como antes de tener Atlas.
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB=${MONGODB_DB:-agenda}
      - MONGODB_COLECCION=${MONGODB_COLECCION:-tablero}
    volumes:
      # La caché local y los respaldos de conflicto quedan en el repo del host
      # para poder mirarlos; ya no se versionan (ver .gitignore).
      - ./datos:/code/datos
